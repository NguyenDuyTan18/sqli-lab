name: sqli-single-sandbox-four-teams

hosts:
  - name: attacker1
    base_box:
      image: ubuntu-22.04
      mgmt_user: ubuntu
    flavor: standard.small
  - name: attacker2
    base_box:
      image: ubuntu-22.04
      mgmt_user: ubuntu
    flavor: standard.small
  - name: attacker3
    base_box:
      image: ubuntu-22.04
      mgmt_user: ubuntu
    flavor: standard.small
  - name: attacker4
    base_box:
      image: ubuntu-22.04
      mgmt_user: ubuntu
    flavor: standard.small
  - name: checker
    base_box:
      image: ubuntu-22.04
      mgmt_user: ubuntu
    flavor: standard.small
    hidden: true

routers:
  - name: lab-router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: service-net
    cidr: 10.20.10.0/24
    accessible_by_user: true
  - name: checker-net
    cidr: 10.20.20.0/24
    accessible_by_user: false
    hidden: true

net_mappings:
  - host: attacker1
    network: service-net
    ip: 10.20.10.11
  - host: attacker2
    network: service-net
    ip: 10.20.10.12
  - host: attacker3
    network: service-net
    ip: 10.20.10.13
  - host: attacker4
    network: service-net
    ip: 10.20.10.14
  - host: checker
    network: checker-net
    ip: 10.20.20.10

router_mappings:
  - router: lab-router
    network: service-net
    ip: 10.20.10.1
  - router: lab-router
    network: checker-net
    ip: 10.20.20.1

groups:
  - name: attackers
    nodes:
      - attacker1
      - attacker2
      - attacker3
      - attacker4
